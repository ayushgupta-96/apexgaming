<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Apex Gaming | Wallet</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/mobile-home-fixes.css">
  <style>
    .wallet-screen{min-height:100vh;background:#001f18;color:#fff;padding-bottom:92px}
    .wallet-screen *{box-sizing:border-box}
    .wallet-head{height:64px;background:#00352a;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid rgba(255,255,255,.04)}
    .wallet-back{position:absolute;left:22px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#fff;font-size:34px;font-weight:300;line-height:1;padding:0;cursor:pointer}
    .wallet-head-title{font-size:27px;font-weight:500;letter-spacing:.2px}
    .wallet-total{background:linear-gradient(180deg,#0a9b69 0%,#005c43 100%);height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .wallet-total-icon{width:48px;height:40px;margin-bottom:10px;display:flex;align-items:center;justify-content:center}
    .wallet-total-icon svg{width:48px;height:40px;display:block}
    .wallet-total-amount{font-size:48px;font-weight:300;line-height:1.05}
    .wallet-total-label{font-size:25px;margin-top:8px;font-weight:400}
    .wallet-panel{margin:20px 22px 0;background:#00342a;border-radius:18px;padding:34px 10px 25px;box-shadow:0 7px 18px rgba(0,0,0,.18)}
    .wallet-rings{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
    .wallet-ring-wrap{display:flex;flex-direction:column;align-items:center}
    .wallet-ring{width:138px;height:138px;border-radius:50%;border:11px solid #e5bb4e !important;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(229,187,78,.18),inset 0 0 0 1px rgba(255,255,255,.02)}
    .wallet-ring b{font-size:31px;color:#e8c75c}
    .wallet-ring-amount{font-size:28px;color:#e6c15a;margin-top:13px}
    .wallet-ring-name{font-size:21px;color:#dfc875;margin-top:3px}
    .wallet-transfer{margin:31px 0 29px;width:100%;height:68px;border:0;border-radius:40px;background:linear-gradient(180deg,#f1cd67,#d7ad3e);color:#fff;font-size:25px;font-weight:800;cursor:pointer}
    .wallet-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;text-align:center;width:100%}
    .wallet-action{border:0;background:transparent;color:#ddd;cursor:pointer;font-size:16px;line-height:1.22;min-width:0;padding:0}
    .wallet-action-icon{width:clamp(66px,21vw,94px);height:clamp(66px,21vw,94px);margin:0 auto 9px;border-radius:25px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 12px rgba(0,0,0,.18);overflow:hidden}
    .wallet-action-icon svg{width:58%;height:58%;display:block}
    .wallet-action.deposit .wallet-action-icon{background:linear-gradient(145deg,#f0bd4a,#e0aa39)}
    .wallet-action.withdraw .wallet-action-icon{background:linear-gradient(145deg,#4d8fe8,#3872ca)}
    .wallet-action.dep-history .wallet-action-icon{background:linear-gradient(145deg,#ed657e,#d94361)}
    .wallet-action.wdr-history .wallet-action-icon{background:linear-gradient(145deg,#42d2ae,#18a987)}
    .wallet-action.deposit .wallet-action-icon{background:linear-gradient(145deg,#f0bd4a,#e0aa39);color:#fff0bd}
    .wallet-action.withdraw .wallet-action-icon{background:linear-gradient(145deg,#4d8fe8,#3872ca);color:#eaf3ff}
    .wallet-action.dep-history .wallet-action-icon{background:linear-gradient(145deg,#ed657e,#d94361);color:#fff}
    .wallet-action.wdr-history .wallet-action-icon{background:linear-gradient(145deg,#42d2ae,#18a987);color:#effff9}
    .wallet-lower-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 22px}
    
    .wallet-mini-card{height:140px;background:#00342a;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#d7d7d7}
    .wallet-mini-card strong{font-size:21px;color:#eee}
    .wallet-mini-card span{font-size:22px;margin-top:10px;color:#9eaaa6}
    .wallet-withdraw-panel{display:none;margin:0 18px 24px;background:#00342a;border-radius:18px;padding:22px 18px}
    .wallet-withdraw-panel.open{display:block}
    .wallet-withdraw-panel h2{margin:0 0 18px;color:#e8c75c;font-size:25px}
    .wallet-withdraw-panel .form-group{margin-bottom:15px}
    .wallet-withdraw-panel .form-label{color:#ddd}
    .wallet-withdraw-panel .form-control{background:#002a22;border-color:#075e4d;color:#fff}
    .wallet-withdraw-panel .wide-btn{margin-top:5px}
    @media(max-width:420px){
      .wallet-panel{margin-left:22px;margin-right:22px;padding-left:8px;padding-right:8px}
      .wallet-ring{width:132px;height:132px}
      .wallet-action-icon{width:78px;height:78px}
      .wallet-action{font-size:15px}
      .wallet-transfer{font-size:24px}
      .wallet-lower-grid{margin-left:22px;margin-right:22px}
      .wallet-total{height:218px}.wallet-total-amount{font-size:48px}.wallet-total-label{font-size:23px}
      .wallet-panel{margin:24px 14px 0;padding:30px 10px 22px}
      .wallet-ring{width:128px;height:128px}.wallet-ring b{font-size:29px}.wallet-ring-amount{font-size:25px}.wallet-ring-name{font-size:18px}
      .wallet-transfer{height:68px;font-size:25px}
      .wallet-action-icon{width:78px;height:78px;font-size:40px}.wallet-action{font-size:15px}
      .wallet-lower-grid{margin:22px 14px;gap:14px}
    }
  </style>
</head>
<body class="apex-mobile-app wallet-screen">
  <header class="wallet-head">
    <button class="wallet-back" onclick="window.location.href='/'" aria-label="Back to home">‹</button>
    <div class="wallet-head-title">Wallet</div>
  </header>

  <main>
    <section class="wallet-total" aria-label="Total wallet balance">
      <div class="wallet-total-icon" aria-hidden="true"><svg viewBox="0 0 80 60" fill="none"><rect x="8" y="8" width="55" height="43" rx="10" fill="#F3F3F3"/><path d="M15 15l17-9h28c7 0 12 5 12 12v20c0 7-5 12-12 12H18c-6 0-10-4-10-10V15h7Z" fill="#D8DDDC"/><rect x="24" y="20" width="25" height="7" rx="4" fill="#7C8786"/><circle cx="67" cy="32" r="7" fill="#F1F1F1"/></svg></div>
      <div class="wallet-total-amount">₹<span id="walletTotalBalance">0.00</span></div>
      <div class="wallet-total-label">Total balance</div>
    </section>

    <section class="wallet-panel">
      <div class="wallet-rings">
        <div class="wallet-ring-wrap">
          <div class="wallet-ring"><b id="walletMainPercent">0%</b></div>
          <div class="wallet-ring-amount">₹<span id="txtDepositBal">0.00</span></div>
          <div class="wallet-ring-name">Main wallet</div>
        </div>
        <div class="wallet-ring-wrap">
          <div class="wallet-ring"><b id="walletThirdPercent">0%</b></div>
          <div class="wallet-ring-amount">₹<span id="walletThirdBalance">0.00</span></div>
          <div class="wallet-ring-name">3rd party wallet</div>
        </div>
      </div>

      <button class="wallet-transfer" onclick="window.location.href='/deposit.html'">Main wallet transfer</button>

      <div class="wallet-actions">
        <button class="wallet-action deposit" onclick="window.location.href='/deposit.html'">
          <span class="wallet-action-icon" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M10 28h44v20a8 8 0 0 1-8 8H18a8 8 0 0 1-8-8V28Z" fill="#FFF5D8"/><path d="M15 28c0-12 8-20 17-20s17 8 17 20" stroke="#E6C36A" stroke-width="7"/><path d="M17 35h30v13H17z" fill="#EBD59A"/></svg></span><span>Deposit</span>
        </button>
        <button class="wallet-action withdraw" onclick="document.getElementById('withdrawPanel').classList.toggle('open')">
          <span class="wallet-action-icon" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><rect x="10" y="9" width="44" height="46" rx="5" fill="#EAF3FF"/><rect x="17" y="18" width="30" height="18" rx="3" fill="#5B91E4"/><path d="M22 44h20" stroke="#4A7DCC" stroke-width="5" stroke-linecap="round"/><path d="M28 25h8" stroke="#EAF3FF" stroke-width="4" stroke-linecap="round"/></svg></span><span>Withdraw</span>
        </button>
        <button class="wallet-action dep-history" onclick="alert('Deposit history will appear here.')">
          <span class="wallet-action-icon" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M15 8h34v48H15z" fill="#FFF2F4"/><path d="M24 18h16M24 28h16M24 38h16M24 48h10" stroke="#D9556C" stroke-width="4" stroke-linecap="round"/></svg></span><span>Deposit<br>history</span>
        </button>
        <button class="wallet-action wdr-history" onclick="alert('Withdrawal history will appear here.')">
          <span class="wallet-action-icon" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M8 20c0-5 4-9 9-9h30c5 0 9 4 9 9v25c0 5-4 9-9 9H17c-5 0-9-4-9-9V20Z" fill="#E8FFF7"/><path d="M8 23h48v13H8z" fill="#B5EEDC"/><circle cx="21" cy="44" r="7" fill="#3AC09A"/><path d="m18 44 2 2 4-5" stroke="#E8FFF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Withdrawal<br>history</span>
        </button>
      </div>
    </section>

    <section class="wallet-lower-grid">
      <div class="wallet-mini-card"><strong>0.00</strong><span>ARGame</span></div>
      <div class="wallet-mini-card"><strong>0.00</strong><span>Lottery</span></div>
    </section>

    <section id="withdrawPanel" class="wallet-withdraw-panel">
      <h2>Withdraw Funds</h2>
      <div class="form-group">
        <label class="form-label">Withdrawable Winnings Balance</label>
        <div class="big-balance">₹<span id="txtWithdrawableBal">0.00</span></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="wdrAmountInput">Withdrawal Amount (₹)</label>
        <input type="number" id="wdrAmountInput" class="form-control" placeholder="Min ₹200" min="200" step="50">
      </div>
      <div class="form-group">
        <label class="form-label" for="wdrTypeSelect">Destination Type</label>
        <select id="wdrTypeSelect" class="form-control">
          <option value="UPI">UPI VPA</option>
          <option value="BANK_ACCOUNT">Bank Account (IMPS)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="wdrNameInput">Account Holder Name</label>
        <input type="text" id="wdrNameInput" class="form-control" placeholder="As per bank records">
      </div>
      <div class="form-group">
        <label class="form-label" for="wdrVpaInput">UPI VPA or Bank Account Number</label>
        <input type="text" id="wdrVpaInput" class="form-control" placeholder="username@okhdfcbank or account number">
      </div>
      <button class="btn btn-primary wide-btn" onclick="requestWithdrawal()">Submit Withdrawal Request</button>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Mobile bottom navigation">
    <a class="bottom-nav-btn" href="/" data-tab="home" aria-label="Home"><span>⌂</span><small>Home</small></a>
    <a class="bottom-nav-btn" href="/#games" data-tab="games" aria-label="Games"><span>✦</span><small>Games</small></a>
    <a class="bottom-nav-btn center-action play-action" href="/" data-tab="aviator" aria-label="Play"><span>▶</span><small>Play</small></a>
    <a class="bottom-nav-btn" href="/deposit.html" data-tab="deposit" aria-label="Deposit"><span>₹</span><small>Deposit</small></a>
    <a class="bottom-nav-btn active" href="/wallet.html" data-tab="wallet" aria-label="Wallet"><span>◈</span><small>Wallet</small></a>
  </nav>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (!localStorage.getItem('rmg_token')) {
        window.location.href = '/';
        return;
      }
      if (typeof fetchWallet === 'function') fetchWallet();

      const observer = new MutationObserver(function () {
        const dep = document.getElementById('txtDepositBal');
        const total = document.getElementById('walletTotalBalance');
        const withdrawable = document.getElementById('txtWithdrawableBal');
        const winnings = document.getElementById('txtWinningsBal');
        if (dep && total) total.textContent = dep.textContent;
        if (withdrawable && winnings) withdrawable.textContent = winnings.textContent;
      });
      const dep = document.getElementById('txtDepositBal');
      if (dep) observer.observe(dep, {childList:true,subtree:true});
    });
  </script>
</body>
</html>
